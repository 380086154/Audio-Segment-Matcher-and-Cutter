name: Build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AudioMatcher.slnx

      - name: Build
        run: dotnet build AudioMatcher.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test AudioMatcher.slnx --no-build --configuration Release --verbosity normal
